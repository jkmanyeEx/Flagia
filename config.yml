# Reference routes only.
#
# Production uses a remotely-managed Cloudflare Tunnel installed with a rotated
# token. The actual public-hostname routes are managed in the Cloudflare
# dashboard, so this file intentionally contains no tunnel ID or credentials.
ingress:
  - hostname: flagia.devmeko.xyz
    service: http://127.0.0.1:5173
  - hostname: flagiaapi.devmeko.xyz
    service: http://127.0.0.1:3000
  - hostname: flagia.kr
    service: http://127.0.0.1:5173
  - hostname: api.flagia.kr
    service: http://127.0.0.1:3000
  - service: http_status:404
