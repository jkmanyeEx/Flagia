name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagia-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            flagia-frontend/package-lock.json
            flagia-backend/package-lock.json

      - name: Build frontend
        working-directory: flagia-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend
        working-directory: flagia-backend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package release
        run: |
          tar -czf "${GITHUB_SHA}.tar.gz" \
            ecosystem.config.cjs \
            pm2_startup.sh \
            scripts \
            ops \
            flagia-frontend/dist \
            flagia-backend/dist \
            flagia-backend/package.json \
            flagia-backend/package-lock.json \
            flagia-backend/mysql_dump.sql \
            flagia-backend/migrations

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/flagia_ec2"
          chmod 0600 "$HOME/.ssh/flagia_ec2"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          remote_user="${EC2_USER:-ubuntu}"
          ssh -i "$HOME/.ssh/flagia_ec2" "$remote_user@$EC2_HOST" \
            "mkdir -p /home/ubuntu/Flagia/incoming"
          scp -i "$HOME/.ssh/flagia_ec2" "${GITHUB_SHA}.tar.gz" \
            "$remote_user@$EC2_HOST:/home/ubuntu/Flagia/incoming/${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          remote_user="${EC2_USER:-ubuntu}"
          ssh -i "$HOME/.ssh/flagia_ec2" "$remote_user@$EC2_HOST" \
            "bash -s -- '$GITHUB_SHA'" < scripts/receive-deploy.sh

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://api.flagia.kr/api/health
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://flagia.kr/ >/dev/null
