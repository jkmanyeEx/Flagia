name: Remote Deploy Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout fresh code
        uses: actions/checkout@v4

      - name: Build (in runner workspace)
        run: |
          echo "Building frontend & backend..."
          cd flagia-frontend
          npm ci --verbose
          npm install
          npm run build
          cd ../flagia-backend
          npm ci --verbose
          npm install
          npm run build

      - name: Publish build to the live app directory
        # IMPORTANT: pm2 runs the app from $HOME/server/Flagia, NOT from this
        # runner's workspace ($GITHUB_WORKSPACE). Previously the workflow built
        # here and ran `pm2 restart all` without copying the result over, so pm2
        # kept restarting STALE code (old bundle + old backend). Sync the freshly
        # built app into the live directory. Overlay copy (no delete) so any
        # runtime-only files already in the live dir are preserved.
        run: |
          set -e
          APP="$HOME/server/Flagia"
          mkdir -p "$APP/flagia-backend" "$APP/flagia-frontend"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a "$GITHUB_WORKSPACE/flagia-backend/"  "$APP/flagia-backend/"
            rsync -a "$GITHUB_WORKSPACE/flagia-frontend/" "$APP/flagia-frontend/"
          else
            cp -a "$GITHUB_WORKSPACE/flagia-backend/."  "$APP/flagia-backend/"
            cp -a "$GITHUB_WORKSPACE/flagia-frontend/." "$APP/flagia-frontend/"
          fi
          echo "Published build to $APP"

      - name: Apply database migrations
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_MIGRATE_USER }}
          DB_PASS: ${{ secrets.DB_MIGRATE_PASS }}
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            echo "mysql client not found; backend boot ensureSchema will migrate."
            exit 0
          fi
          if [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
            echo "DB migration secrets not set; backend boot ensureSchema will migrate."
            exit 0
          fi
          shopt -s nullglob
          for f in "$HOME/server/Flagia/flagia-backend/migrations/"*.sql; do
            echo "Applying migration: $f"
            mysql --host="$DB_HOST" --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" < "$f"
          done
          echo "Migrations applied."

      # Provision a MySQL user for remote (Cloudflare Tunnel) access. The tunnel
      # proxies tcp://localhost:3306, so connections arrive from 127.0.0.1 — hence
      # the '@127.0.0.1' host. Idempotent; skips unless the secrets are set. Uses
      # the privileged migration account (which has GRANT OPTION) to create it.
      - name: Provision remote (tunnel) DB user
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_MIGRATE_USER }}
          DB_ADMIN_PASS: ${{ secrets.DB_MIGRATE_PASS }}
          REMOTE_USER: ${{ secrets.DB_REMOTE_USER }}
          REMOTE_PASS: ${{ secrets.DB_REMOTE_PASS }}
        run: |
          if ! command -v mysql >/dev/null 2>&1; then echo "no mysql client"; exit 0; fi
          if [ -z "$DB_ADMIN_USER" ] || [ -z "$DB_NAME" ]; then
            echo "Admin DB secrets not set; skipping remote user provisioning."; exit 0
          fi
          if [ -z "$REMOTE_USER" ] || [ -z "$REMOTE_PASS" ]; then
            echo "DB_REMOTE_USER / DB_REMOTE_PASS not set; skipping remote user provisioning."; exit 0
          fi
          set -e  # surface a real failure (the step is continue-on-error, so it won't block the deploy)
          SQL_FILE="$(mktemp)"
          {
            printf "CREATE USER IF NOT EXISTS '%s'@'127.0.0.1' IDENTIFIED BY '%s';\n" "$REMOTE_USER" "$REMOTE_PASS"
            printf "ALTER USER '%s'@'127.0.0.1' IDENTIFIED BY '%s';\n" "$REMOTE_USER" "$REMOTE_PASS"
            printf "GRANT ALL PRIVILEGES ON %s.* TO '%s'@'127.0.0.1';\n" "$DB_NAME" "$REMOTE_USER"
            printf "FLUSH PRIVILEGES;\n"
          } > "$SQL_FILE"
          mysql --host="$DB_HOST" --user="$DB_ADMIN_USER" --password="$DB_ADMIN_PASS" < "$SQL_FILE"
          rm -f "$SQL_FILE"
          echo "Provisioned ${REMOTE_USER}@127.0.0.1 with ALL PRIVILEGES on ${DB_NAME}.*"

      - name: Restart PM2 process manager
        run: pm2 restart all
