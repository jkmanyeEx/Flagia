name: Remote Deploy Workflow

# 1. Strict Trigger Filter: Only run when a push hits the 'main' branch
on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses the old naming

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout fresh code
        uses: actions/checkout@v4

      - name: Execute local deployment commands
        run: |
          echo "New code pushed to main. Deploying changes..."
          cd ~/server
          rm -rf Flagia
          gh repo clone jkmanyeEx/Flagia
          cd flagia-frontend
          npm install
          npm run build
          cd ../flagia-backend
          npm install
          npm run build
          pm2 restart all