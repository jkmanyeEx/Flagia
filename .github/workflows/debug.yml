name: Server Diagnostics

# Manually-triggered, READ-ONLY diagnostics that run on the prod box (the
# self-hosted runner). Use this to inspect prod when there's no SSH access:
#   GitHub → Actions → "Server Diagnostics" → Run workflow → pick a target.
# Then open the run and copy the logs. Nothing here mutates state.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to inspect'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pm2
          - logs
          - db
          - health
          - git
          - submissions
          - regrade

jobs:
  diagnostics:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        env:
          TARGET: ${{ inputs.target }}
          DB_HOST: 127.0.0.1
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_MIGRATE_USER }}
          DB_PASS: ${{ secrets.DB_MIGRATE_PASS }}
        run: |
          want() { [ "$TARGET" = "all" ] || [ "$TARGET" = "$1" ]; }
          line() { echo ""; echo "===== $1 ====="; }

          if want git; then
            line "GIT STATE"
            git log -1 --oneline || true
            echo "HEAD: $(git rev-parse HEAD 2>/dev/null)"
            git status -s | head -20 || true
          fi

          if want pm2; then
            line "PM2 LIST"
            pm2 list || true
            line "PM2 INFO (flagia-backend)"
            pm2 info flagia-backend 2>/dev/null | grep -iE "status|restart|uptime|script|exec cwd|node|error log|out log" || true
          fi

          if want logs; then
            line "BACKEND OUT LOG (last 60)"
            pm2 logs flagia-backend --out --lines 60 --nostream 2>/dev/null | tail -60 || true
            line "BACKEND ERROR LOG (last 60)"
            pm2 logs flagia-backend --err --lines 60 --nostream 2>/dev/null | tail -60 || true
          fi

          if want health; then
            line "APP HEALTH (try common ports)"
            for p in 3000 3502; do
              echo "--- 127.0.0.1:$p/api/health ---"
              curl -s -m 5 -w "\nHTTP %{http_code}\n" "http://127.0.0.1:$p/api/health" || echo "no response on $p"
            done
          fi

          if want db; then
            line "DATABASE"
            if ! command -v mysql >/dev/null 2>&1; then
              echo "mysql client not found on runner."
            elif [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
              echo "DB secrets (DB_NAME / DB_MIGRATE_USER / DB_MIGRATE_PASS) not set; skipping DB checks."
            else
              MYSQL="mysql --host=$DB_HOST --user=$DB_USER --password=$DB_PASS $DB_NAME -t"
              echo "--- current user & version ---"
              $MYSQL -e "SELECT CURRENT_USER() AS current_user, VERSION() AS version;" || true
              echo "--- grants (does this user have ALTER?) ---"
              mysql --host=$DB_HOST --user=$DB_USER --password=$DB_PASS -e "SHOW GRANTS;" || true
              echo "--- users.role enum ---"
              $MYSQL -e "SHOW COLUMNS FROM users LIKE 'role';" || true
              echo "--- submissions.time_spent_sec present? ---"
              $MYSQL -e "SHOW COLUMNS FROM submissions LIKE 'time_spent_sec';" || true
              echo "--- assignments.continuable present? (should be empty) ---"
              $MYSQL -e "SHOW COLUMNS FROM assignments LIKE 'continuable';" || true
              echo "--- owner account role ---"
              $MYSQL -e "SELECT name, email, role FROM users WHERE email='devmeko463@gmail.com';" || true
              echo "--- accounts named 한지로 + all current admins ---"
              $MYSQL -e "SELECT id, name, email, role, created_at FROM users WHERE name LIKE '%한지로%' OR role='ADMIN' ORDER BY created_at;" || true
              echo "--- remote-access DB users (host=127.0.0.1) ---"
              $MYSQL -e "SELECT user, host, plugin FROM mysql.user WHERE host='127.0.0.1';" || true
            fi
          fi

          if want submissions; then
            line "RECENT SUBMISSIONS & STORED KEYSTROKE EVENTS"
            if ! command -v mysql >/dev/null 2>&1 || [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
              echo "mysql client or DB secrets unavailable; skipping."
            else
              MYSQL="mysql --host=$DB_HOST --user=$DB_USER --password=$DB_PASS $DB_NAME"
              echo "--- DETAILS FOR SUBMISSION: 765c39a1 ---"
              $MYSQL -e "SELECT id, status, flagia_score AS score, flag_status AS flag, ROUND(coefficient_of_variation,3) AS cv, ROUND(revision_ratio,2) AS rr, total_paste_count AS pastes, ROUND(total_blur_duration) AS blur_s, JSON_EXTRACT(analysis_json, '\$.components') AS components FROM submissions WHERE id = '765c39a1-cb26-4e55-9768-155ccda5e504' \G" || true
              $MYSQL -e "SELECT SUBSTRING(s.final_markdown, 1, 300) AS md_short, SUBSTRING(a.template_text, 1, 300) AS tmpl_short FROM submissions s JOIN assignments a ON s.assignment_id = a.id WHERE s.id = '765c39a1-cb26-4e55-9768-155ccda5e504' \G" || true
              echo "--- TARGET: onsae09 — submission overview ---"
              $MYSQL -t -e "SELECT s.id, s.status, LENGTH(s.final_markdown) AS md_len, LENGTH(a.template_text) AS tmpl_len, (SELECT COUNT(*) FROM sessions se WHERE se.submission_id=s.id) AS sessions FROM submissions s JOIN assignments a ON s.assignment_id=a.id JOIN users u ON s.student_id=u.id WHERE u.email='onsae09@gmail.com' ORDER BY s.created_at DESC LIMIT 3;" || true
              echo "--- onsae09 keydown key distribution ---"
              $MYSQL -e "SELECT jt.k AS key_val, COUNT(*) AS cnt FROM sessions se JOIN submissions s ON se.submission_id=s.id JOIN users u ON s.student_id=u.id JOIN JSON_TABLE(se.events_blob, '\$[*]' COLUMNS (typ VARCHAR(20) PATH '\$.type', k VARCHAR(24) PATH '\$.meta.key')) jt WHERE u.email='onsae09@gmail.com' AND jt.typ='keydown' GROUP BY jt.k ORDER BY cnt DESC LIMIT 15;" || true
              echo "--- onsae09 final_markdown (first 400 chars) ---"
              $MYSQL -N -e "SELECT SUBSTRING(s.final_markdown,1,400) FROM submissions s JOIN users u ON s.student_id=u.id WHERE u.email='onsae09@gmail.com' ORDER BY s.created_at DESC LIMIT 1;" || true
              echo "--- onsae09 template_text (first 300 chars) ---"
              $MYSQL -N -e "SELECT SUBSTRING(a.template_text,1,300) FROM submissions s JOIN assignments a ON s.assignment_id=a.id JOIN users u ON s.student_id=u.id WHERE u.email='onsae09@gmail.com' ORDER BY s.created_at DESC LIMIT 1;" || true
              echo "--- last 5 submissions ---"
              $MYSQL -e "SELECT id, status, time_spent_sec AS tspent, LENGTH(final_markdown) AS md_len, created_at, submitted_at FROM submissions ORDER BY created_at DESC LIMIT 5;" || true
              echo "--- scored submissions: raw metrics (why green?) ---"
              $MYSQL -e "SELECT LEFT(id,8) AS id, flagia_score AS score, flag_status AS flag, ROUND(coefficient_of_variation,3) AS cv, ROUND(revision_ratio,2) AS rr, total_paste_count AS pastes, ROUND(total_blur_duration) AS blur_s, LENGTH(final_markdown) AS md_len FROM submissions WHERE status IN ('SUBMITTED','FORCE_CLOSED') ORDER BY created_at DESC LIMIT 6;" || true
              echo "--- per-component raw scores (from analysis_json) ---"
              $MYSQL -e "SELECT LEFT(id,8) AS id, JSON_EXTRACT(analysis_json,'\$.components.typingRhythm.raw') AS rhythm, JSON_EXTRACT(analysis_json,'\$.components.revisionIntensity.raw') AS revision, JSON_EXTRACT(analysis_json,'\$.components.externalContent.raw') AS external, JSON_EXTRACT(analysis_json,'\$.components.focusDuration.raw') AS focus, JSON_EXTRACT(analysis_json,'\$.components.writingTime.raw') AS wtime, JSON_EXTRACT(analysis_json,'\$.sessionSummary.totalDurationSec') AS dur_s FROM submissions WHERE status IN ('SUBMITTED','FORCE_CLOSED') ORDER BY created_at DESC LIMIT 6;" || true
              echo "--- sessions + event counts for the last 5 submissions ---"
              $MYSQL -e "SELECT se.submission_id, se.id AS session_id, se.start_time, se.end_time, JSON_LENGTH(se.events_blob) AS events, LENGTH(se.events_blob) AS bytes FROM sessions se JOIN (SELECT id FROM submissions ORDER BY created_at DESC LIMIT 5) r ON r.id = se.submission_id ORDER BY se.start_time DESC;" || true
              echo "--- first 600 chars of the most-recent session's events_blob ---"
              $MYSQL -N -e "SELECT SUBSTRING(events_blob,1,600) FROM sessions ORDER BY start_time DESC LIMIT 1;" || true
              echo "--- recent assignments (classroom_id NULL = standalone/join-code) ---"
              $MYSQL -e "SELECT id, LEFT(title,24) AS title, classroom_id, join_code, created_at FROM assignments ORDER BY created_at DESC LIMIT 8;" || true
              echo "--- classroom membership counts ---"
              $MYSQL -e "SELECT c.id, LEFT(c.name,20) AS name, (SELECT COUNT(*) FROM classroom_members m WHERE m.classroom_id=c.id) AS members, (SELECT COUNT(*) FROM assignments a WHERE a.classroom_id=c.id) AS assignments FROM classrooms c ORDER BY c.created_at DESC LIMIT 8;" || true
              echo "--- students (most recent) ---"
              $MYSQL -e "SELECT id, LEFT(email,28) AS email, created_at FROM users WHERE role='STUDENT' ORDER BY created_at DESC LIMIT 8;" || true
            fi
          fi

          if want regrade; then
            line "REGRADE ALL SUBMITTED SUBMISSIONS (new engine)"
            if [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
              echo "DB secrets unavailable; skipping regrade."
            else
              cd "$HOME/server/Flagia/flagia-backend"
              SQL_USER="$DB_USER" SQL_PW="$DB_PASS" node dist/regrade.js 2>&1 | tail -60 || true
            fi
          fi

          echo ""
          echo "Diagnostics complete."
