name: Server Diagnostics

# Manually-triggered, READ-ONLY diagnostics that run on the prod box (the
# self-hosted runner). Use this to inspect prod when there's no SSH access:
#   GitHub → Actions → "Server Diagnostics" → Run workflow → pick a target.
# Then open the run and copy the logs. Nothing here mutates state.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to inspect'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pm2
          - logs
          - db
          - health
          - git

jobs:
  diagnostics:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        env:
          TARGET: ${{ inputs.target }}
          DB_HOST: 127.0.0.1
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_MIGRATE_USER }}
          DB_PASS: ${{ secrets.DB_MIGRATE_PASS }}
        run: |
          want() { [ "$TARGET" = "all" ] || [ "$TARGET" = "$1" ]; }
          line() { echo ""; echo "===== $1 ====="; }

          if want git; then
            line "GIT STATE"
            git log -1 --oneline || true
            echo "HEAD: $(git rev-parse HEAD 2>/dev/null)"
            git status -s | head -20 || true
          fi

          if want pm2; then
            line "PM2 LIST"
            pm2 list || true
            line "PM2 INFO (flagia-backend)"
            pm2 info flagia-backend 2>/dev/null | grep -iE "status|restart|uptime|script|exec cwd|node|error log|out log" || true
          fi

          if want logs; then
            line "BACKEND OUT LOG (last 60)"
            pm2 logs flagia-backend --out --lines 60 --nostream 2>/dev/null | tail -60 || true
            line "BACKEND ERROR LOG (last 60)"
            pm2 logs flagia-backend --err --lines 60 --nostream 2>/dev/null | tail -60 || true
          fi

          if want health; then
            line "APP HEALTH (try common ports)"
            for p in 3000 3502; do
              echo "--- 127.0.0.1:$p/api/health ---"
              curl -s -m 5 -w "\nHTTP %{http_code}\n" "http://127.0.0.1:$p/api/health" || echo "no response on $p"
            done
          fi

          if want db; then
            line "DATABASE"
            if ! command -v mysql >/dev/null 2>&1; then
              echo "mysql client not found on runner."
            elif [ -z "$DB_USER" ] || [ -z "$DB_NAME" ]; then
              echo "DB secrets (DB_NAME / DB_MIGRATE_USER / DB_MIGRATE_PASS) not set; skipping DB checks."
            else
              MYSQL="mysql --host=$DB_HOST --user=$DB_USER --password=$DB_PASS $DB_NAME -t"
              echo "--- current user & version ---"
              $MYSQL -e "SELECT CURRENT_USER() AS current_user, VERSION() AS version;" || true
              echo "--- grants (does this user have ALTER?) ---"
              mysql --host=$DB_HOST --user=$DB_USER --password=$DB_PASS -e "SHOW GRANTS;" || true
              echo "--- users.role enum ---"
              $MYSQL -e "SHOW COLUMNS FROM users LIKE 'role';" || true
              echo "--- submissions.time_spent_sec present? ---"
              $MYSQL -e "SHOW COLUMNS FROM submissions LIKE 'time_spent_sec';" || true
              echo "--- assignments.continuable present? (should be empty) ---"
              $MYSQL -e "SHOW COLUMNS FROM assignments LIKE 'continuable';" || true
              echo "--- owner account role ---"
              $MYSQL -e "SELECT name, email, role FROM users WHERE email='devmeko463@gmail.com';" || true
            fi
          fi

          echo ""
          echo "Diagnostics complete."
